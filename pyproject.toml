[project]
name = "rapp-skill"
version = "1.1.0"
description = "Run the RAPP ecosystem and convert RAPP agents to Agent Skills from any AI harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q", "--tb=short"]
